<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>보안 위반 감지</title>

<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden;}
.cctv-frame{position:relative;width:100%;aspect-ratio:16/8;background:#000;overflow:hidden;}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);
filter:grayscale(0.6) contrast(1.2) brightness(0.85);}

/* 노이즈 */
.noise{position:absolute;inset:0;
background:url('https://grainy-gradients.vercel.app/noise.svg');
opacity:.15;pointer-events:none;}

/* 스캔라인 */
.cctv-frame::after{
content:'';position:absolute;inset:0;
background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.05) 4px);
pointer-events:none;
}

/* HUD */
.hud{position:absolute;inset:0;color:#0f0;font-family:monospace;font-size:12px;}
.hud-tl{position:absolute;top:10px;left:12px;}
.hud-tr{position:absolute;top:10px;right:12px;text-align:right;}
.rec{color:red}

/* 타겟 박스 */
.face-box{
position:absolute;border:2px solid red;
box-shadow:0 0 10px red;
pointer-events:none;
}

/* 기본 레이아웃 */
main{padding:40px;text-align:center;}
button{padding:12px 20px;font-size:16px;}
</style>
</head>

<body>

<!-- 인트로 -->
<div id="intro" style="position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;">
  <div>화면 클릭하여 시작</div>
</div>

<main>

<!-- CCTV -->
<div class="cctv-frame">
  <video id="video" autoplay playsinline muted></video>
  <div class="noise"></div>

  <div class="hud">
    <div class="hud-tl">
      <span class="rec">●</span> REC<br>
      CAM-04
    </div>
    <div class="hud-tr">
      <span id="time">00:00:00</span><br>
      LIVE
    </div>
  </div>
</div>

<h1>보안위반자, 당신입니다</h1>

<div id="counter">---</div>

</main>

<script>
// 카메라 시작
async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user'},
      audio:false
    });
    document.getElementById('video').srcObject = stream;
    fakeDetect();
  }catch(e){
    alert('카메라 권한 필요');
  }
}

// 가짜 얼굴 감지
function fakeDetect(){
  setInterval(()=>{
    document.querySelectorAll('.face-box').forEach(e=>e.remove());
    const box=document.createElement('div');
    box.className='face-box';
    box.style.left=Math.random()*60+20+'%';
    box.style.top=Math.random()*40+20+'%';
    box.style.width='120px';
    box.style.height='160px';
    document.body.appendChild(box);
  },1200);
}

// 시계
setInterval(()=>{
  const n=new Date();
  document.getElementById('time').textContent=n.toLocaleTimeString();
},1000);

// 카운터
let count=0;
function updateCounter(){
  count++;
  document.getElementById('counter').textContent=count;
}

// 인트로 클릭
document.getElementById('intro').addEventListener('click',()=>{
  document.getElementById('intro').style.display='none';
  startCamera();
  updateCounter();
});
</script>

</body>
</html>
